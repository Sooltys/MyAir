<mat-toolbar color="primary">
  <a routerLink="/" class="brand">
    <img src="/favicon.png" alt="" width="32" height="32" />
    <span>My Air</span>
  </a>
  <span class="spacer"></span>
  <button matButton="elevated" [matMenuTriggerFor]="menu">Województwa</button>
  <mat-menu #menu="matMenu">
    @for (voivodeship of voivodeships; track voivodeship.id) {
      <a mat-menu-item [routerLink]="['/wojewodztwo', voivodeship.id]">{{ voivodeship.name }}</a>
    }
  </mat-menu>
  <a matButton="elevated" color="accent" href="https://puzyna.pl" target="_blank" rel="noopener">
    Autor
  </a>
</mat-toolbar>
