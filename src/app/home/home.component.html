<div class="home">
  <img [src]="map().image" usemap="#image-map" alt="Mapa województw Polski" />
  <map name="image-map">
    @for (voivodeship of voivodeships; track voivodeship.id) {
      <area
        shape="poly"
        [routerLink]="['/wojewodztwo', voivodeship.id]"
        [attr.coords]="map().cords[voivodeship.id - 1]"
        [alt]="voivodeship.name"
        [title]="voivodeship.name"
      />
    }
  </map>
</div>
